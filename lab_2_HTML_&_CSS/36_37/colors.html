<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица цветов RGB</title>
</head>
<body bgcolor="#ffffff" text="#000000">

    <h1>Палитра RGB</h1>

    <!-- Таблица с рамкой 1 пиксель -->
    <table border="1" cellpadding="8" cellspacing="0">
        
        <!-- 1 строка -->
        <tr>
            <td>-</td>
            <td bgcolor="#FF0000">Красный<br>FF0000</td>
            <td bgcolor="#00FF00">Зеленый<br>00FF00</td>
            <td bgcolor="#0000FF">Синий<br>0000FF</td>
        </tr>

        <!-- 2 строка -->
        <tr>
            <td bgcolor="#FF0000">Красный<br>FF0000</td>
            <td bgcolor="#FF0000">Красный<br>FF0000</td>
            <td bgcolor="#FFFF00">Желтый<br>FFFF00</td>
            <td bgcolor="#FF00FF">Пурпурный<br>FF00FF</td>
        </tr>

        <!-- 3 строка -->
        <tr>
            <td bgcolor="#00FF00">Зеленый<br>00FF00</td>
            <td bgcolor="#FFFF00">Желтый<br>FFFF00</td>
            <td bgcolor="#00FF00">Зеленый<br>00FF00</td>
            <td bgcolor="#00FFFF">Бирюзовый<br>00FFFF</td>
        </tr>

        <!-- 4 строка -->
        <tr>
            <td bgcolor="#0000FF">Синий<br>0000FF</td>
            <td bgcolor="#FF00FF">Пурпурный<br>FF00FF</td>
            <td bgcolor="#00FFFF">Бирюзовый<br>00FFFF</td>
            <td bgcolor="#0000FF">Синий<br>0000FF</td>
        </tr>

    </table>

</body>
</html>
