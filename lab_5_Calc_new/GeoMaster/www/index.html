<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263f">
<title>ГеоМастер — калькулятор фигур</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <img src="img/logo.svg" class="logo" alt="Логотип ГеоМастер" width="46" height="46">
  <div><h1>ГеоМастер</h1><p>Периметр, площадь и объём фигур</p></div>
</header>
<main>
  <div class="seg" role="tablist" aria-label="Тип фигур">
    <button type="button" role="tab" data-dim="2" aria-selected="true">Плоские</button>
    <button type="button" role="tab" data-dim="3" aria-selected="false">Объёмные</button>
  </div>
  <div id="shapes" class="shapes" role="list"></div>

  <section class="card">
    <h2 id="title"></h2>
    <div class="paper"><img id="pic" alt="" width="300" height="190"></div>
    <div class="row">
      <label for="unit">Единицы длины</label>
      <select id="unit">
        <option value="мм">миллиметры (мм)</option>
        <option value="см" selected>сантиметры (см)</option>
        <option value="м">метры (м)</option>
      </select>
    </div>
    <form id="form" novalidate>
      <div id="fields"></div>
      <div class="btns">
        <button type="submit" class="primary">Рассчитать</button>
        <button type="reset" class="ghost">Сбросить</button>
      </div>
    </form>
  </section>

  <section id="result" class="card result" hidden aria-live="polite"></section>

  <!-- Блок с кнопкой "Об авторе" -->
  <div style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
    <button type="button" id="aboutBtn" class="ghost" style="width: 100%; border-color: var(--line);">Информация об авторе</button>
  </div>
</main>

<!-- Модальное окно "Об авторе" -->
<div id="aboutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(18,38,63,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div class="card" style="max-width:320px; margin:20px; text-align:center; border: 2px solid var(--acc);">
    <h2 style="color: var(--ink);">Об авторе</h2>
    <p style="font-size: 1.1rem; line-height: 1.6;">Разработал студент<br><strong>Смирнов Никита Русланович</strong><br>группы <strong>ИСТ-33</strong></p>
    <button type="button" class="primary" onclick="document.getElementById('aboutModal').style.display='none'" style="margin-top: 15px;">Закрыть окно</button>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
