<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задание 17 - абсолютное позиционирование картинки</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <h1>Задание 17: Абсолютное позиционирование</h1>
  <p>Изображение внутри блока div смещено на 500px вниз и на 500px влево (от верхнего левого угла страницы).</p>

  <!-- Блок div с абсолютным позиционированием -->
  <div style="position: absolute; top: 500px; left: 500px;">
    <!-- Изображение (используем картинку машины из вашей папки images) -->
    <img src="../images/car.jpg" alt="Машина" width="200">
  </div>

</body>
</html>
