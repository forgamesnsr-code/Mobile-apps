<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задание 20 - слои и z-index, плывущая картинка</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/ex20.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden;">

  <h2 style="padding-left: 30px; margin-top: 20px;">Абсолютное позиционирование и Z-index</h2>
  <hr style="margin-left: 30px; margin-right: 30px; border-top: 2px solid #ccc;">

  <!-- СИНИЙ КВАДРАТ (z-index: 1 - самый нижний слой, машина пройдет сверху) -->
  <div style="position:absolute; top:90px; left:400px; width:150px; height:150px;
              background:blue; color:white; font-size:32px; z-index:1; padding: 10px;">
    Это<br>раньше
  </div>

  <!-- КАРТИНКА (z-index: 2 - средний слой) -->
  <img id="boat" src="../images/car.jpg" alt="Картинка"
       style="position:absolute; top:100px; left:0; width:200px; z-index:2;">

  <!-- КРАСНЫЙ КВАДРАТ (z-index: 3 - самый верхний слой, перекроет машину) -->
  <div style="position:absolute; top:90px; left:180px; width:150px; height:150px;
              background:red; color:white; font-size:32px; z-index:3; padding: 10px;">
    Это<br>ближе
  </div>

</body>
</html>
