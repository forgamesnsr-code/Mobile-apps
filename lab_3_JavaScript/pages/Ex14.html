<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задание 14 - проверка формы</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/ex14.js"></script>
</head>
<body>
  <h2>Форма заполнения данных</h2>
  <form name="regForm" action="#" method="post" id="regForm">
    <p>Ваше имя: * <input type="text" name="name" size="30"></p>
    <p>Пароль: * <input type="password" name="password" size="30"></p>
    <p>Подтверждение пароля: * <input type="password" name="confirmPassword" size="30"></p>
    <p>Электронный адрес: * <input type="text" name="email" size="30"></p>
    <p>Тема сообщения: <input type="text" name="subject" size="30"></p>
    <p>Сообщение: *<br>
      <textarea name="message" rows="6" cols="50"></textarea>
    </p>
    <p>
      <input type="submit" value="Отправить">
      <input type="reset" value="Очистить">
    </p>
    <p><small>* — поля, обязательные для заполнения</small></p>
  </form>
</body>
</html>
