<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>text decoration - Задание 16</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- Подключаем внешний скрипт в head, чтобы функции были доступны -->
  <script src="../js/ex16.js"></script>
</head>
<body>
  <!-- События остаются прямо в теге h1, как в задании -->
  <h1 id="head" 
      onMouseover="addunderline()" 
      onMouseout="removeunderline()"
      onclick="addoverline()" 
      ondblclick="addlinethrough()">
    Добро пожаловать на нашу страницу!
  </h1>
</body>
</html>
